name: AI-DLC sync check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  aidlc-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check effort record accompanies substantive changes
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-aidlc-sync.mjs
